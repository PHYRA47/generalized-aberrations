# System-level defaults for the cellphone camera lens (US 2019/0129149 A1, sys 710).
# Sensor/PSF numbers follow the specifications in Ansys KA-01995 Part 1:
#   IMPORTANT: this design needs torch.set_default_dtype(torch.float64).
#   trainer.precision:64 casts module params but NOT the tensors created inside
#   pupil sampling / ray initialization, which follow the GLOBAL default dtype.
#   At this scale (sub-mm airspaces, R down to 0.592 mm) the float32 aspheric
#   marching solve fails: 33% ray-miss, all fields >30 deg lost, and the
#   distortion loss reads 0.44 instead of 0.0106. See docs note for the runner.
#   pixel ~2.5 um, Nyquist ~200 cyc/mm, MTF > 0.2 at Nyquist, semi-diagonal 2-2.7 mm.
model:
  ray_initialization:
    class_path: eisoptx.modeling.ray_initialization.RayInitialization
    init_args:
      aperture_type: epd
      aperture: 1.1995  # f/F# = 2.399/2.0
      hfov: 47.5  # half of the patent's 95 deg full FOV
      n_fields: 11
      pupil_sampling_mode: skew_uniform_jittered
      pupil_sampling_kwargs:
        n_r: 8
        n_i: 1
      ray_aiming_steps: 0
      ray_aiming_locations: tbs
      field_stop_position:
      wavelengths: [486, 587, 656]
      wavelength_weights: [1, 1, 1]
  optics_simulator:
    class_path: eisoptx.modeling.simulation.OpticsSimulator
    init_args:
      shape: [1080, 1920]  # 2.377 um pixel -> Nyquist 210 cyc/mm (article: 2.5 um / 200)
      shape_type: image
      psf_abs_size: 16.638e-03  # 7 pix
      sigma_rel: 1.
      diffraction_f_number: 2.  # Airy radius 1.34 um at 550 nm (article: 1.4 um)
      kernel_type: linear
      psf_grid_shape: [3, 3]
      wavelength_weights:
        - [0., 0., 1.]
        - [0., 1., 0.]
        - [1., 0., 0.]
      patch_overlap: 0.25
  e2e_vector_mode:
  e2e_loss_weight:
  residuals:
    - class_path: eisoptx.optimization.residuals.TransverseRayAberrationResiduals
      init_args:
        weight: 1.
    - class_path: eisoptx.optimization.residuals.RayPathResiduals
      init_args:
        weight: 20.
        min_cutoff: .05  # sub-mm airspaces in this design; wide_angle's .1 is too coarse
        max_cutoff: .inf
        min_cutoff_refractive: .2
        max_cutoff_refractive: 1.
        min_cutoff_refractive_relative: 0.3333
        max_cutoff_refractive_relative: 3.
        other_min_cutoffs: []
        other_max_cutoffs: []
    - class_path: eisoptx.optimization.residuals.RayAngleResiduals
      init_args:
        weight: 10.
        max_angle: 65.  # 47.5 deg half-field drives steep incidence at the rear group
    - class_path: eisoptx.optimization.residuals.SurfaceNormalResiduals
      init_args:
        weight: 10.
        max_angle: 40.  # strongly aspheric plastics; 30 deg clips the L5 surfaces
    - class_path: eisoptx.optimization.residuals.DistortionResiduals
      init_args:
        weight: 10.
        threshold: 0.02
  lens_optimizer:
    class_path: eisoptx.optimization.optimizers.LMOptimizer
    init_args:
      lm_parameter: 1.
      damped_term_min: 1e-6
      tolerance: 1.5
      lam_eps: 1e-8
      lam_increase_factor: 2.
      lam_decrease_factor: 3.
data:
  class_path: eisoptx.data.datasets.NoneDataModule
  init_args:
    n_samples: 100
trainer:
  accelerator: auto
  max_steps: 20000
  log_every_n_steps: 1
  val_check_interval: 100
  check_val_every_n_epoch:
  precision: 64
  logger:
    class_path: eisoptx.main.CustomLogger
    init_args:
      save_dir: logs/logs_cellphone
  callbacks:
    - eisoptx.utils.callbacks.ExtendedLoggingCallback
    - eisoptx.utils.callbacks.CodeVSeqFileCallback
    - eisoptx.utils.callbacks.ConfigFileCallback
    - eisoptx.main.CustomProgressBar
    - class_path: ModelCheckpoint
      init_args:
        every_n_train_steps: 100
    - class_path: eisoptx.utils.visualization.VisualizationCallback
      init_args:
        every_n_steps: 20
        visualizations:
          - class_path: eisoptx.utils.visualization.LensLayout
            init_args:
              wavelengths: [450., 650., 550.]
              n_fields: 4
              n_rays: 5
              rc_params:
                axes.linewidth: '.75'
                xtick.major.size: '5.'
                xtick.minor.size: '3.'
                ytick.major.size: '5.'
                ytick.minor.size: '3.'
          - class_path: eisoptx.utils.visualization.GlassPlot
            init_args:
              plot_partial_dispersion: False
              rc_params:
                lines.linewidth: '1.'
                figure.figsize: '3.2, 4.'
        save_formats: []
        rc_params:
          figure.figsize: '3.2, 2.1'
          figure.constrained_layout.use: 'True'
          figure.constrained_layout.h_pad: '0.015625'
          figure.constrained_layout.w_pad: '0.015625'
          figure.dpi: '200'
          font.size: '7'
          lines.linewidth: '.75'
