# Experiment A: material optimization over the moldable-plastics catalog.
#
# Warm start = patent_710_real_materials.yml geometry (real curvatures/aspherics,
# not a flat cold start). Only the glass variables are unfrozen: L1-L5 become
# continuous variables in GlassModel's PCA glass-space (seeded from the article's
# real-material substitution), snapped to the nearest configs/moldable_plastics.csv
# entry at the halfway point of training via BindMaterialsCallback, matching the
# convention in configs/telephoto/defaults.yml. Cover glass and IR filter stay
# frozen to their real fixed part (N-BK7) -- those are off-the-shelf hardware, not
# design variables.
#
# TTL/EFL targets are UNCHANGED from the baseline patent design (total_track_length_solve:
# 4.802, target_efl: 2.399) so this experiment isolates the effect of material choice
# alone -- see opt_min_ttl.yml for the separate form-factor experiment.
model:
  lens_parameterization:
    class_path: eisoptx.optimization.parameterization.LensParameterization
    init_args:
      # R = cover glass | s = stop (at L1 front, patent's dummy surf 3/4)
      # aRa x5 = the five extended aspheres | R = IR cut filter
      lens_sequence: R-s-aRa-aRa-aRa-aRa-aRa-R-
      a:  # [conic K, A4, A6, A8, A10, A12, A14, A16, A18, A20] per aspheric surface
        - [0., -0.0754068, 0.231315, -1.64698, 4.43718, -6.54981, 3.03756, 0., 0., 0.]  # L1 front (surf  5)
        - [0., -0.22436, -0.245325, 0.265302, -0.903303, 1.04281, -0.95042, -0.170912, 0., 0.]  # L1 back  (surf  6)
        - [0., -0.563451, 0.560572, -5.39081, 15.5628, -23.4623, 16.2935, -3.65427, 0., 0.]  # L2 front (surf  7)
        - [0., -0.424662, 1.44087, -6.9929, 17.0595, -23.5796, 18.9485, -8.32376, 1.56115, 0.]  # L2 back  (surf  8)
        - [0., -0.233007, 2.12497, -8.17804, 16.6612, -19.5817, 13.6595, -5.30161, 0.886355, 0.]  # L3 front (surf  9)
        - [-1., -0.0194019, 0.021374, -0.057457, 0.220338, -0.425957, 0.386038, -0.113319, 0.00224867, 0.]  # L3 back  (surf 10)
        - [0., 0.115599, -0.457601, 0.741619, -0.974199, 0.856136, -0.480696, 0.155943, -0.0217562, 0.]  # L4 front (surf 11)
        - [-1., 0.0386776, -0.341815, 0.414133, -0.319359, 0.156504, -0.0453415, 0.00705167, -0.000455397, 0.]  # L4 back  (surf 12)
        - [-1., -0.816695, 0.387565, -0.0640573, -0.00108281, -0.00448342, 0.00416376, -0.00124009, 0.000168211, -8.92759e-06]  # L5 front (surf 13)
        - [-1., -1.10499, 1.06232, -0.80308, 0.441832, -0.165942, 0.0407746, -0.00623311, 0.000536585, -1.98606e-05]  # L5 back  (surf 14)
      c:  # 1/R per interface; 0 = plano (cover front, IR filter both faces)
        - 0.             # surf  1 cover front  (Inf)
        - -0.005154639175257732 # surf  2 cover back   (R=-194.000)
        - 0.4880429477794046 # surf  5 L1 front     (R=   2.049)
        - -0.005472674934054267 # surf  6 L1 back      (R=-182.726)
        - 0.0297601333253973 # surf  7 L2 front     (R=  33.602)
        - 0.15487068297971193 # surf  8 L2 back      (R=   6.457)
        - -0.27314941272876264 # surf  9 L3 front     (R=  -3.661)
        - -1.0111223458038423 # surf 10 L3 back      (R=  -0.989)
        - 0.2041649652919559 # surf 11 L4 front     (R=   4.898)
        - 0.4892367906066536 # surf 12 L4 back      (R=   2.044)
        - 1.287001287001287 # surf 13 L5 front     (R=   0.777)
        - 1.6891891891891893 # surf 14 L5 back      (R=   0.592)
        - 0.             # surf 15 IRCF front   (Inf)
        - 0.             # surf 16 IRCF back    (Inf)
      d: []
      m: []
      # Seed nd/vd from the article's real-material substitution; L1-L5 are unfrozen
      # below and will move continuously through glass-space from this starting point.
      nd: [1.517, 1.544, 1.68, 1.544, 1.68, 1.544, 1.517]
      vd: [64.2, 56., 18.2, 56., 18.2, 56., 64.2]
      s:  # thickness at each element, air gap at each '-' (mm)
        - 0.8          # cover glass thickness
        - 0.15         # cover back -> stop
        - 0.           # stop -> L1 front        (stop AT the L1 front vertex; see note above)
        - 0.527        # L1 centre thickness
        - 0.231        # L1 -> L2
        - 0.251        # L2 centre thickness
        - 0.098        # L2 -> L3
        - 0.876        # L3 centre thickness
        - 0.05         # L3 -> L4
        - 0.35         # L4 centre thickness
        - 0.097        # L4 -> L5
        - 0.301        # L5 centre thickness
        - 0.386        # L5 -> IR filter
        - 0.21         # IR filter thickness
        - 0.475        # IR filter -> sensor (solved from TTL)
      nominal_wavelength: 550.
      freeze:
        s:  # free the airspaces and lens thicknesses; hold the fixed hardware
          default: False
          toggle_row_col_list: [0, -1, -2]  # cover thickness, IRCF thickness, solved gap
        c:
          default: False
          toggle_row_col_list: [0, 1, -1, -2, -3]  # cover, IR filter, EFL-solved surface
        g:  # free L1-L5 material variables; keep cover glass (0) and IR filter (-1) fixed hardware
          default: False
          toggle_row_col_list: [0, -1]
        a:  # freeze conic constants; they overlap with the r^4 aspheric term
          default: False
          toggle_row_col_list:
            - [null, 0]
        d: True
        m: True
      target_efl: 2.399
      solve_type: focal_length
      solve_idx: -3  # L5 rear surface (last powered surface before the IR filter)
      paraxial_image_solve: False
      total_track_length_solve: 4.802
      qc_vars: False  # continuous glass-space optimization; BindMaterialsCallback snaps to catalog mid-run
      scale_factor: 1  # EPD / 2 = 0.59975 mm
      bezier_aspherics: True
      glass_file: configs/moldable_plastics.csv
      misc_surface_model:
trainer:
  # Full callbacks list (not `+`) so LensLayout.label_materials can be set below --
  # jsonargparse can't reach into one field of a list item merged from defaults.yml.
  callbacks:
    - eisoptx.utils.callbacks.ExtendedLoggingCallback
    - eisoptx.utils.callbacks.CodeVSeqFileCallback
    - eisoptx.utils.callbacks.ConfigFileCallback
    - eisoptx.main.CustomProgressBar
    - class_path: ModelCheckpoint
      init_args:
        every_n_train_steps: 100
    - class_path: eisoptx.utils.callbacks.BindMaterialsCallback
      init_args:
        step: .5
    - class_path: eisoptx.utils.visualization.VisualizationCallback
      init_args:
        every_n_steps: 20
        visualizations:
          - class_path: eisoptx.utils.visualization.LensLayout
            init_args:
              wavelengths: [450., 650., 550.]
              n_fields: 3
              n_rays: 3
              diameter_scaler: 1.0
              label_materials: True  # free glass: label each element with its nearest catalog glass
              rc_params:
                axes.linewidth: '.75'
                xtick.major.size: '5.'
                xtick.minor.size: '3.'
                ytick.major.size: '5.'
                ytick.minor.size: '3.'
          - class_path: eisoptx.utils.visualization.GlassPlot
            init_args:
              plot_partial_dispersion: False
              rc_params:
                lines.linewidth: '1.'
                figure.figsize: '3.2, 4.'
        save_formats: []
        rc_params:
          figure.figsize: '3.2, 2.1'
          figure.constrained_layout.use: 'True'
          figure.constrained_layout.h_pad: '0.015625'
          figure.constrained_layout.w_pad: '0.015625'
          figure.dpi: '200'
          font.size: '5'
          lines.linewidth: '.50'
