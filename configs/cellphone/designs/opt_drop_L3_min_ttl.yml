# Experiment D: combine C (drop L3, 4-element warm start) with B (minimize TTL).
#
# Geometry is opt_drop_L3.yml's 4-element arrays (see that file's header for the
# array bookkeeping against LensSequence("R-s-aRa-aRa-aRa-aRa-R-")). TTL handling
# is opt_min_ttl.yml's mechanism: no exact total_track_length_solve, every spacing
# free (including the image gap), and a one-sided TotalTrackLengthResiduals
# pulling toward the same 3.5mm target used in experiment B for direct
# comparability. RayAngleResiduals/SurfaceNormalResiduals are loosened the same
# way (65->75, 40->55) since tighter packaging steepens incidence at the rear
# group -- with one fewer element to share the optical power, this is the
# hardest of the four experiments to converge.
#
# target_efl unchanged (2.399mm) -- same optical spec, testing whether 4 elements
# can hit it in a smaller package than the 5-element baseline. Materials frozen
# to the real substitution (not the plastic catalog) to isolate element-count +
# form-factor from material choice.
model:
  lens_parameterization:
    class_path: eisoptx.optimization.parameterization.LensParameterization
    init_args:
      # R = cover glass | s = stop (at L1 front) | aRa x4 = L1, L2, L4, L5 | R = IR cut filter
      lens_sequence: R-s-aRa-aRa-aRa-aRa-R-
      a:  # [conic K, A4, A6, A8, A10, A12, A14, A16, A18, A20] per aspheric surface
        - [0., -0.0754068, 0.231315, -1.64698, 4.43718, -6.54981, 3.03756, 0., 0., 0.]  # L1 front
        - [0., -0.22436, -0.245325, 0.265302, -0.903303, 1.04281, -0.95042, -0.170912, 0., 0.]  # L1 back
        - [0., -0.563451, 0.560572, -5.39081, 15.5628, -23.4623, 16.2935, -3.65427, 0., 0.]  # L2 front
        - [0., -0.424662, 1.44087, -6.9929, 17.0595, -23.5796, 18.9485, -8.32376, 1.56115, 0.]  # L2 back
        - [0., 0.115599, -0.457601, 0.741619, -0.974199, 0.856136, -0.480696, 0.155943, -0.0217562, 0.]  # L4 front
        - [-1., 0.0386776, -0.341815, 0.414133, -0.319359, 0.156504, -0.0453415, 0.00705167, -0.000455397, 0.]  # L4 back
        - [-1., -0.816695, 0.387565, -0.0640573, -0.00108281, -0.00448342, 0.00416376, -0.00124009, 0.000168211, -8.92759e-06]  # L5 front
        - [-1., -1.10499, 1.06232, -0.80308, 0.441832, -0.165942, 0.0407746, -0.00623311, 0.000536585, -1.98606e-05]  # L5 back
      c:  # 1/R per interface; 0 = plano (cover front, IR filter both faces)
        - 0.             # cover front  (Inf)
        - -0.005154639175257732 # cover back   (R=-194.000)
        - 0.4880429477794046 # L1 front     (R=   2.049)
        - -0.005472674934054267 # L1 back      (R=-182.726)
        - 0.0297601333253973 # L2 front     (R=  33.602)
        - 0.15487068297971193 # L2 back      (R=   6.457)
        - 0.2041649652919559 # L4 front     (R=   4.898)
        - 0.4892367906066536 # L4 back      (R=   2.044)
        - 1.287001287001287 # L5 front     (R=   0.777)
        - 1.6891891891891893 # L5 back      (R=   0.592)
        - 0.             # IRCF front   (Inf)
        - 0.             # IRCF back    (Inf)
      d: []
      m: []
      nd: [1.517, 1.544, 1.68, 1.68, 1.544, 1.517]  # cover, L1, L2, L4, L5, IRCF (L3 dropped)
      vd: [64.2, 56., 18.2, 18.2, 56., 64.2]
      s:  # thickness at each element, air gap at each '-' (mm)
        - 0.8          # cover glass thickness
        - 0.15         # cover back -> stop
        - 0.           # stop -> L1 front
        - 0.527        # L1 centre thickness
        - 0.231        # L1 -> L2
        - 0.251        # L2 centre thickness
        - 0.148        # L2 -> L4 (merged: was L2->L3 0.098 + L3->L4 0.05)
        - 0.35         # L4 centre thickness
        - 0.097        # L4 -> L5
        - 0.301        # L5 centre thickness
        - 0.386        # L5 -> IR filter
        - 0.21         # IR filter thickness
        - 0.475        # IR filter -> sensor (free now; no longer solved from TTL)
      nominal_wavelength: 550.
      freeze:
        s:  # free every spacing including the image gap; only cover/IRCF thicknesses fixed
          default: False
          toggle_row_col_list: [0, -2]  # cover thickness, IRCF thickness
        c:
          default: False
          toggle_row_col_list: [0, 1, -1, -2, -3]  # cover, IR filter, EFL-solved surface
        g: True  # materials fixed to the real substitution; not part of this experiment
        a:  # freeze conic constants; they overlap with the r^4 aspheric term
          default: False
          toggle_row_col_list:
            - [null, 0]
        d: True
        m: True
      target_efl: 2.399
      solve_type: focal_length
      solve_idx: -3  # L5 rear surface (last powered surface before the IR filter)
      paraxial_image_solve: False
      total_track_length_solve:  # unset: last spacing is free, TTL is only soft-penalized below
      qc_vars: False
      scale_factor: 1  # EPD / 2 = 0.59975 mm
      bezier_aspherics: True
      glass_file:
      misc_surface_model:
  residuals:
    - class_path: eisoptx.optimization.residuals.TransverseRayAberrationResiduals
      init_args:
        weight: 1.
    - class_path: eisoptx.optimization.residuals.RayPathResiduals
      init_args:
        weight: 20.
        min_cutoff: .05
        max_cutoff: .inf
        min_cutoff_refractive: .2
        max_cutoff_refractive: 1.
        min_cutoff_refractive_relative: 0.3333
        max_cutoff_refractive_relative: 3.
        other_min_cutoffs: []
        other_max_cutoffs: []
    - class_path: eisoptx.optimization.residuals.RayAngleResiduals
      init_args:
        weight: 10.
        max_angle: 75.  # loosened from 65 -- tighter packaging steepens incidence at the rear group
    - class_path: eisoptx.optimization.residuals.SurfaceNormalResiduals
      init_args:
        weight: 10.
        max_angle: 55.  # loosened from 40 -- same reason
    - class_path: eisoptx.optimization.residuals.DistortionResiduals
      init_args:
        weight: 10.
        threshold: 0.02
    - class_path: eisoptx.optimization.residuals.TotalTrackLengthResiduals
      init_args:
        weight: 5.
        target: 3.5  # same target as experiment B, for direct comparability
